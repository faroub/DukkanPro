</div>

<div aria-label="Business Category Selection" class="flex flex-col gap-card-gap" id="category-selector" role="radiogroup">

<div class="icon-bubble w-11 h-11 rounded-full flex items-center justify-center shrink-0 transition-colors bg-secondary-fixed/50 text-secondary">
<span class="material-symbols-outlined text-[24px]">bakery_dining</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label text-label text-text-primary truncate">Home bakery</span>
<span class="font-caption text-caption text-text-secondary truncate mt-0.5" dir="auto">Gâteaux &amp; Pâtisserie maison / حلويات منزلية</span>
</div>
</div>
<div class="check-pill shrink-0 w-6 h-6 rounded-full flex items-center justify-center transition-all bg-surface-alt text-transparent">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
</button>

<button aria-checked="false" class="business-card group relative w-full text-left p-card-padding rounded-xl transition-all duration-200 shadow-sm flex items-center justify-between bg-surface shadow-[0_1px_3px_rgba(0,0,0,0.06)] hover:bg-surface-bright" data-value="social_seller" role="radio" type="button">
<div class="flex items-center gap-3.5 min-w-0 pr-2">
<div class="icon-bubble w-11 h-11 rounded-full flex items-center justify-center shrink-0 transition-colors bg-[#FCE7F3] text-[#BE185D]">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label text-label text-text-primary truncate">Instagram seller</span>
<span class="font-caption text-caption text-text-secondary truncate mt-0.5" dir="auto">Vente en ligne &amp; Réseaux / متجر إنستغرام</span>
</div>
</div>
<div class="check-pill shrink-0 w-6 h-6 rounded-full flex items-center justify-center transition-all bg-surface-alt text-transparent">
<span class="material-symbols-outlined text-[18px]">check</span>

</button>

<div class="flex items-center gap-3.5 min-w-0 pr-2">

<span class="material-symbols-outlined text-[24px]">store</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label text-label text-text-primary truncate">Market vendor</span>
<span class="font-caption text-caption text-text-secondary truncate mt-0.5" dir="auto">Marché &amp; Vendeur ambulant / بائع في السوق</span>
</div>
</div>
<div class="check-pill shrink-0 w-6 h-6 rounded-full flex items-center justify-center transition-all bg-surface-alt text-transparent">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
</button>

<button aria-checked="false" class="business-card group relative w-full text-left p-card-padding rounded-xl transition-all duration-200 shadow-sm flex items-center justify-between bg-surface shadow-[0_1px_3px_rgba(0,0,0,0.06)] hover:bg-surface-bright" data-value="services" role="radio" type="button">

<span class="font-caption text-caption text-text-secondary truncate mt-0.5" dir="auto">Prestation de services / خدمات</span>
</div>
</div>
<div class="check-pill shrink-0 w-6 h-6 rounded-full flex items-center justify-center transition-all bg-surface-alt text-transparent">

</button>
<!-- 6. Other -->

<span class="material-symbols-outlined text-[24px]">auto_awesome</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label text-label text-text-primary truncate">Other</span>

</div>
</div>
<div class="check-pill shrink-0 w-6 h-6 rounded-full flex items-center justify-center transition-all bg-surface-alt text-transparent">

<span>Continue</span>

</button>
<button class="w-full h-10 flex items-center justify-center text-text-secondary font-label text-label hover:text-text-primary transition-colors cursor-pointer" onclick="history.back()" type="button">
      Back
    </button>
</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.business-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-[#F4FAF6]', 'shadow-[0_0_0_2px_#1B6B3A]');
          c.classList.add('bg-surface', 'shadow-[0_1px_3px_rgba(0,0,0,0.06)]');
          
          const pill = c.querySelector('.check-pill');
          if (pill) {
            pill.classList.remove('bg-primary-container', 'text-surface');
            pill.classList.add('bg-surface-alt', 'text-transparent');
          }
        });

        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-surface', 'shadow-[0_1px_3px_rgba(0,0,0,0.06)]');
        card.classList.add('bg-[#F4FAF6]', 'shadow-[0_0_0_2px_#1B6B3A]');

        const activePill = card.querySelector('.check-pill');
        if (activePill) {
          activePill.classList.remove('bg-surface-alt', 'text-transparent');
          activePill.classList.add('bg-primary-container', 'text-surface');
        }
      });
    });
  })();
