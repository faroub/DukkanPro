<!-- Title & Subtitles -->

<!-- Language Selection Section -->
<div class="flex flex-col gap-card-gap w-full my-auto">

        Select Language • اختر اللغة
      </span>
<span class="material-symbols-outlined text-text-muted text-[18px]">
        translate
      </span>
</div>
<!-- Option 1: Arabic -->
<button class="lang-card group text-left w-full bg-surface p-card-padding rounded-xl shadow-sm flex items-center justify-between transition-all duration-150 active:scale-[0.99]" data-selected="false" onclick="selectLanguage(this, 'العربية', 'Continue', 'متابعة')" type="button">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-10 h-10 rounded-lg bg-surface-alt flex items-center justify-center text-text-primary font-label text-label font-bold transition-colors">

        </div>
<div class="flex flex-col min-w-0">
<span class="font-body text-body font-semibold text-text-primary leading-tight" dir="rtl">

</div>

<div class="radio-indicator w-6 h-6 rounded-full bg-surface-alt flex items-center justify-center transition-all">
<div class="radio-dot w-2.5 h-2.5 rounded-full bg-transparent transition-all"></div>
</div>
</button>

<button class="lang-card group text-left w-full bg-primary-light p-card-padding rounded-xl shadow-sm flex items-center justify-between transition-all duration-150 active:scale-[0.99] selected-lang" data-selected="true" onclick="selectLanguage(this, 'Français', 'Continuer', 'متابعة')" type="button">
<div class="flex items-center gap-3.5 min-w-0">

<div class="flex items-center gap-2">

</div>

<div class="radio-indicator w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-xs">

<button class="lang-card group text-left w-full bg-surface p-card-padding rounded-xl shadow-sm flex items-center justify-between transition-all duration-150 active:scale-[0.99]" data-selected="false" onclick="selectLanguage(this, 'English', 'Continue', 'متابعة')" type="button">
<div class="flex items-center gap-3.5 min-w-0">

</div>

</div>

<!-- Trust / Reassurance micro-card -->
<div class="mt-6 mb-6 p-3 bg-surface rounded-xl shadow-sm flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-primary-light flex items-center justify-center text-primary shrink-0">

      </span>
</div>

<span class="font-label text-label text-text-primary leading-snug">

      </span>

        Work seamlessly with or without internet connection
      </span>
</div>

<!-- Bottom Fixed Primary CTA -->
<div class="w-full flex flex-col gap-2 mt-auto">
<button class="w-full h-12 bg-primary-container hover:bg-primary-dark active:scale-[0.98] text-on-primary font-label text-label text-base rounded-[10px] shadow-sm flex items-center justify-center gap-2 transition-all duration-150" id="submit-cta" type="button">
<span id="cta-label">Continuer</span>
<span class="material-symbols-outlined text-[20px]">
        arrow_forward
      </span>
</button>
<p class="text-center font-caption text-caption text-text-muted text-xs mt-1">
      You can change your language anytime in Settings
    </p>
</div>
</div>
<script>
  function selectLanguage(selectedButton, langName, ctaText) {
    const allCards = document.querySelectorAll('.lang-card');
    allCards.forEach(card => {
      card.setAttribute('data-selected', 'false');
      card.className = 'lang-card group text-left w-full bg-surface p-card-padding rounded-xl shadow-sm flex items-center justify-between transition-all duration-150 active:scale-[0.99]';
      
      const badge = card.querySelector('.rounded-lg');
      if (badge) {
        badge.className = 'w-10 h-10 rounded-lg bg-surface-alt flex items-center justify-center text-text-primary font-label text-label font-bold transition-colors';
      }

      const defaultTag = card.querySelector('span.uppercase');
      if (defaultTag) {
        defaultTag.remove();
      }

      const title = card.querySelector('.font-body');
      if (title) {
        title.className = 'font-body text-body font-semibold text-text-primary leading-tight';
      }

      const sub = card.querySelector('.font-caption');
      if (sub) {
        sub.className = 'font-caption text-caption text-text-secondary';
      }

      const radio = card.querySelector('.radio-indicator');
      if (radio) {
        radio.className = 'radio-indicator w-6 h-6 rounded-full bg-surface-alt flex items-center justify-center transition-all';
        radio.innerHTML = '<div class="radio-dot w-2.5 h-2.5 rounded-full bg-transparent transition-all"></div>';
      }
    });

    selectedButton.setAttribute('data-selected', 'true');
    selectedButton.className = 'lang-card group text-left w-full bg-primary-light p-card-padding rounded-xl shadow-sm flex items-center justify-between transition-all duration-150 active:scale-[0.99] selected-lang';

    const selectedBadge = selectedButton.querySelector('.rounded-lg');
    if (selectedBadge) {
      selectedBadge.className = 'w-10 h-10 rounded-lg bg-primary text-on-primary flex items-center justify-center font-label text-label font-bold transition-colors';
    }

    const selectedTitle = selectedButton.querySelector('.font-body');
    if (selectedTitle) {
      selectedTitle.className = 'font-body text-body font-semibold text-primary leading-tight';
    }

    const selectedSub = selectedButton.querySelector('.font-caption');
    if (selectedSub) {
      selectedSub.className = 'font-caption text-caption text-primary-dark';
    }

    const selectedRadio = selectedButton.querySelector('.radio-indicator');
    if (selectedRadio) {
      selectedRadio.className = 'radio-indicator w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-xs';
      selectedRadio.innerHTML = '<span class="material-symbols-outlined text-on-primary text-[18px]">check</span>';
    }

    const ctaLabel = document.getElementById('cta-label');
    if (ctaLabel) {
      ctaLabel.textContent = ctaText;
    }
  }
</script></main></body></html>
